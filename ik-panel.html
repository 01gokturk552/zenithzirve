<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İK Paneli | Zenith Zirve'26</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="panel.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="panel-body">
    <div id="app">
        <header class="panel-topbar">
            <div class="container">
                <div class="panel-brand">
                    <a href="index.html" class="logo">Zenith Zirve'26</a>
                    <span class="tag">İK</span>
                </div>
                <div class="panel-actions">
                    <a class="panel-link" href="admin-login.html">Admin Paneli →</a>
                    <a class="panel-link" href="index.html" target="_blank" rel="noopener">Siteyi Aç ↗</a>
                    <button id="logoutBtn" class="pbtn pbtn-ghost pbtn-sm">Çıkış</button>
                </div>
            </div>
        </header>

        <main class="panel-main">
            <div class="container">
                <div class="panel-head">
                    <h1>Başvurular</h1>
                    <p>Delege ve delegasyon başvuruları (Google Form yanıtları).</p>
                </div>

                <div id="modeBanner" class="mode-banner" hidden></div>
                <div id="globalStatus" class="status"></div>

                <div class="toolbar">
                    <input type="search" id="search" class="grow" placeholder="Başvurularda ara (isim, e-posta, okul…)">
                    <select id="typeFilter" hidden></select>
                    <button id="refreshBtn" class="pbtn pbtn-ghost">Yenile</button>
                    <button id="csvBtn" class="pbtn pbtn-ghost">CSV indir</button>
                    <span id="count" class="count-badge"></span>
                </div>

                <div id="tableHost"></div>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="default-data.js"></script>
    <script src="panel-common.js"></script>
    <script src="ik-panel.js"></script>
</body>
</html>
